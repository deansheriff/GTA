name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Godot 4.6.3 (official release)
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v4.6.3-stable_linux.x86_64 godot && chmod +x godot
      - name: Import project
        run: ./godot --headless --path game --import
      - name: Unit tests
        run: ./godot --headless --path game --script res://tests/run_tests.gd
