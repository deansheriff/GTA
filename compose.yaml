# Coolify: Application → Docker Compose → /compose.yaml (see docs/COOLIFY.md).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: nsl
      PGDATABASE: nsl
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    expose:
      - "8787"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: nsl
      POSTGRES_USER: nsl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes:
      - nsl_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsl -d nsl"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  nsl_postgres:
