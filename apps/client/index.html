<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2b705" />
    <meta name="description" content="Naija Street Life: a Nigerian life-sim and comedy-crime game. Story mode: Up NEPA!" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Naija Street Life</title>
    <style>
      :root { --ink: #1b1430; --danfo: #f2b705; --paper: #fff6e0; }
      html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; }
      #game { position: fixed; inset: 0; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui * { pointer-events: auto; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; }
      #boot h1 { color: var(--danfo); font-size: 1.6rem; margin: 0 0 .25rem; }
      #boot p { opacity: .8; margin: 0; }
    </style>
  </head>
  <body>
    <div id="boot"><div><h1>Naija Street Life</h1><p>Loading… abeg hold on 🙏🏾</p></div></div>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
